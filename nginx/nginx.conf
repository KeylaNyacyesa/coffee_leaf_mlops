events { worker_connections 4096; }

http {
    # Docker's internal DNS returns one A record per `api` replica; re-resolve every 5 s
    # so `docker compose up --scale api=N` is picked up without restarting nginx.
    resolver 127.0.0.11 valid=5s ipv6=off;

    access_log off;
    client_max_body_size 300M;          # bulk uploads (zips of images)

    server {
        listen 80;

        location / {
            set $api http://api:8000;
            proxy_pass $api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
        }
    }
}
